experiment_name: brats2021_farc_action_harm_v2
data_root: /datastore/phucngt/datasets/BraTS2021
label_scheme: auto
label_scan_max: 128
manifest: data/brats2021_manifest.csv
output_root: outputs/brats2021_farc_v2
split_seed: 2021
source_val_fraction: 0.08
error_train_fraction: 0.12
controller_fraction: 0.12
policy_val_fraction: 0.08
test_fraction: 0.10

segmentor:
  architecture: unet3d
  volume_shape: [128, 128, 128]
  base_channels: 24
  dropout: 0.15
  batch_size: 1
  num_workers: 2
  epochs: 60
  lr: 0.0002
  weight_decay: 0.00001
  amp: true
  patience: 12
  min_delta: 0.0001

error_map:
  width: 8
  dropout: 0.10
  epochs: 10
  lr: 0.0003
  weight_decay: 0.00001
  max_pos_weight: 50
  amp: true
  num_workers: 2

actions:
  min_component_voxels: 64
  hd95_scale: 30.0
  benefit_margin: 0.002
  harm_margin: 0.002

policy:
  failure_dice_threshold: 0.80
  target_auto_failure_upper: 0.15
  confidence: 0.95
  gain_grid: "0.000,0.002,0.005,0.010,0.020"
  harm_grid: "0.05,0.10,0.20,0.30,0.40"
  quality_grid: "0.70,0.75,0.80,0.85,0.90,0.93"
  harm_penalty: 0.05

suite:
  primary:
    architecture: unet3d
    base_channels: 24
    seeds: [42, 123, 2024]
  replication:
    architecture: resunet3d
    base_channels: 20
    seeds: [42]
  mc_samples_main: 5
  mc_samples_replication: 0
